era5:
  data_type: RasterDataset
  version: v1.0
  path: /project/6087451/alaminie/Nile/Data_Catalog_BNB/era5_pet_mmday_fixed_x3.nc
  driver: netcdf
  meta:
    category: meteo
    paper_ref: Hersbach et al (2019)
    source_url: https://doi.org/10.24381/cds.bd0915c6
  crs: 4326
globcover:
  data_type: RasterDataset
  path: /project/6087451/alaminie/Nile/Data_Catalog_BNB/landuse_bnb.tif
  driver: raster
  meta:
    category: landuse & landcover
    paper_doi: 10.1594/PANGAEA.787668
    paper_ref: Arino et al (2012)
    source_license: CC-BY-3.0
    source_url: http://due.esrin.esa.int/page_globcover.php
  crs: 4326
globcover_mapping_default:
  data_type: DataFrame
  path: /project/6087451/alaminie/Nile/HydroMT_Wflow/lib/python3.11/site-packages/hydromt_wflow/data/lulc/globcover_mapping.csv
  driver: csv
  driver_kwargs:
    index_col: 0
    dtype:
      landuse: int16
      Kext: float32
      N: float32
      PathFrac: float32
      RootingDepth: float32
      Sl: float32
      Swood: float32
      WaterFrac: float32
      kc: float32
      alpha_h1: int16
      h1: int16
      h2: int16
      h3_high: int16
      h3_low: int16
      h4: int16
      USLE_C: float32
      Cov_River: float32
  meta:
    category: landuse
    source_info: landuse parameters based on globcover classification (http://due.esrin.esa.int/page_globcover.php)
    source_version: 1.0
grdc:
