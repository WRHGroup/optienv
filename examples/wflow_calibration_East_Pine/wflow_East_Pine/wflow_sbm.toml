[input.lateral.subsurface]
ksathorfrac = "KsatHorFrac"

[input.lateral.land]
n = "N"
slope = "Slope"

[output.lateral.river]
q_av = "q_av_river"
#h = "h_river"
q = "q_river"

[output.lateral.land]
#h = "h_land"
q = "q_land"

[output.vertical]
precipitation = "precipitation"
actevap = "actevap"
runoff = "runoff"
recharge = "recharge"
actleakage = "actleakage"
canopystorage = "canopystorage"
snow = "snow"
snowwater = "snowwater"
