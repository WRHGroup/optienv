casename = "wflow_sbm"
calendar = "proleptic_gregorian"
starttime = 2000-01-01T00:00:00
endtime = 2000-06-30T00:00:00
time_units = "days since 1900-01-01 00:00:00"
timestepsecs = 86400
dir_output = "run_default"

[state]
path_input = "instate/instates.nc"
path_output = "outstate/outstates.nc"

[input]
path_forcing = "inmaps.nc"
path_static = "staticmaps.nc"
ldd = "wflow_ldd"
river_location = "wflow_river"
subcatchment = "wflow_subcatch"
forcing = [ "vertical.precipitation", "vertical.temperature", "vertical.potential_evaporation",]
cyclic = [ "vertical.leaf_area_index",]
gauges = "wflow_gauges"
gauges_hydat-pine = "wflow_gauges_hydat-pine"

[model]
type = "sbm"
masswasting = true
snow = true
reinit = false
reservoirs = false
lakes = false
glacier = false
kin_wave_iteration = true
kw_river_tstep = 900
kw_land_tstep = 3600
thicknesslayers = [ 100, 300, 800,]
river_routing = "kinematic-wave"

[output]
path = "output.nc"
compressionlevel = 1

[csv]
path = "output.csv"
[[csv.column]]
header = "Q"
map = "gauges_hydat-pine"
parameter = "lateral.river.q_av"

#[[csv.column]]
#header = "snow_pillow"
#coordinate.x = -112.4369
#coordinate.y = 59.1181
#parameter = "vertical.snow"

#[[csv.column]]
#header = "snowwater_pillow"
#coordinate.x = -112.4369
#coordinate.y = 59.1181
#parameter = "vertical.snowwater"

[state.vertical]
satwaterdepth = "satwaterdepth"
snow = "snow"
tsoil = "tsoil"
ustorelayerdepth = "ustorelayerdepth"
snowwater = "snowwater"
canopystorage = "canopystorage"

[input.vertical]
altitude = "wflow_dem"
c = "c"
cf_soil = "cf_soil"
cfmax = "Cfmax"
e_r = "EoverR"
f = "f"
infiltcappath = "InfiltCapPath"
infiltcapsoil = "InfiltCapSoil"
kext = "Kext"
kv_0 = "KsatVer"
leaf_area_index = "LAI"
m = "M_"
maxleakage = "MaxLeakage"
pathfrac = "PathFrac"
potential_evaporation = "pet"
precipitation = "precip"
rootdistpar = "rootdistpar"
rootingdepth = "RootingDepth"
soilminthickness = "SoilMinThickness"
soilthickness = "SoilThickness"
specific_leaf = "Sl"
storage_wood = "Swood"
temperature = "temp"
tt = "TT"
tti = "TTI"
ttm = "TTM"
water_holding_capacity = "WHC"
waterfrac = "WaterFrac"
theta_s = "thetaS"
theta_r = "thetaR"
kc = "kc"
alpha_h1 = "alpha_h1"
h1 = "h1"
h2 = "h2"
h3_high = "h3_high"
h3_low = "h3_low"
h4 = "h4"

[state.lateral.river]
q = "q_river"
h = "h_river"
h_av = "h_av_river"

[state.lateral.subsurface]
ssf = "ssf"

[state.lateral.land]
q = "q_land"
h = "h_land"
h_av = "h_av_land"

[input.lateral.river]
length = "wflow_riverlength"
n = "N_River"
slope = "RiverSlope"
width = "wflow_riverwidth"
